<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#174f46">
<title>Beyond Temptation Café — Pickup Orders</title>
<style>
:root{--g:#174f46;--c:#f7efe3;--b:#fffaf3;--l:#e6d8c7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--c);color:#2d211b}
header{background:var(--g);color:white;padding:22px 15px;position:sticky;top:0;z-index:10}.wrap{max-width:980px;margin:auto}
h1{margin:0;font-size:28px}.sub{opacity:.9;margin:4px 0 14px}.search{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px}
.tabs{display:flex;gap:8px;overflow:auto;padding:10px 4px}.tab{white-space:nowrap;border:1px solid #cdbba8;background:#fff;border-radius:999px;padding:8px 12px}
main{max-width:980px;margin:auto;padding:0 14px 110px}h2{color:var(--g);margin:20px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:10px}.item{background:var(--b);border:1px solid var(--l);border-radius:15px;padding:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:700}.price{font-weight:800;white-space:nowrap}.muted{font-size:12px;color:#846e5d;margin-top:3px}
.add,.primary{background:var(--g);color:white;border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.unpriced{opacity:.65}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);padding:10px 14px;z-index:20}.cartinner{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.primary{padding:13px 17px;font-size:15px}.drawer{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-end}.panel{background:var(--c);width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.panelin{max-width:700px;margin:auto}
.row{display:flex;justify-content:space-between;gap:10px;margin:10px 0}.qty button{width:30px;height:30px;border:1px solid #cdbba8;background:#fff;border-radius:8px}
input,textarea{width:100%;padding:12px;border:1px solid #cdbba8;border-radius:10px;font:inherit;background:#fff}label{font-weight:700;display:block;margin:12px 0 6px}
.notice{background:#fff8d9;border:1px solid #e6d48a;padding:10px;border-radius:10px;font-size:13px}
@media(max-width:600px){h1{font-size:24px}.grid{grid-template-columns:1fr}}
</style></head>
<body>
<header><div class="wrap"><h1>Beyond Temptation Café</h1><div class="sub">Digital Menu • Pickup Ordering</div>
<input id="search" class="search" placeholder="Search the menu…"></div></header>
<div class="tabs wrap" id="tabs"></div><main id="menu"></main>
<div class="cartbar"><div class="cartinner"><div><b id="count">0 items</b><div id="total">₹0</div></div><button class="primary" onclick="openCart()">View Cart & Order</button></div></div>
<div class="drawer" id="drawer" onclick="if(event.target===this)closeCart()"><div class="panel"><div class="panelin">
<div class="row"><h2 style="margin:0">Your Pickup Order</h2><button onclick="closeCart()">✕</button></div>
<div id="cart"></div><div class="notice">Pickup only. Parcel charge: ₹10 per item, as listed in the supplied menu.</div>
<label>Your name</label><input id="custName" placeholder="Enter your name">
<label>Mobile number</label><input id="custPhone" placeholder="Enter your mobile number" inputmode="tel">
<label>Order notes (optional)</label><textarea id="notes" rows="3" placeholder="e.g. less spicy, no onion…"></textarea>
<button class="primary" style="width:100%;margin-top:14px" onclick="sendWhatsApp()">Confirm Pickup Order on WhatsApp</button>
</div></div></div>
<script>
const MENU={"Cold Coffee": [["Cold Coffee", 89], ["Cold Coffee with Crush", 109], ["Coffee Hazzle Drizzle", 129], ["Iced Coffee", 129], ["Brownie Coffee", 149], ["Cafe Misu", 139], ["BT Spcl. Thick Cold Coffee", 109], ["BT Spcl. Thick Cold Coffee with Crush", 129], ["BT Spcl. Dark Choco Coffee", 149], ["BT Spcl. Tiramisu Coffee", 159], ["BT Spcl. Hazelnut Coffee", 149], ["BT Spcl. Oreo Coffee", 159], ["BT Spcl. Iced Coffee", 159], ["BT Spcl. Cafe Mud Pie", 169]], "Cad Bee": [["CAD MM", 159], ["CAD BEE", 179], ["CAD Bee Shot", 199], ["White CAD Bee", 199], ["Choco Chips CAD Bee", 199], ["KitKat CAD Bee", 209], ["Hazelnut CAD Bee", 209], ["Combination CAD Bee", 209], ["Brownie Overloaded CAD Bee", 229], ["Blueberry CAD Bee", 229]], "Mastani": [["Mango Mastani", 209], ["Pista Mastani", 199], ["Butterscotch Mastani", 199], ["Strawberry Mastani", 199], ["Dark Chocolate Mastani", 209]], "Coolers": [["Power Punch", 219], ["Exotic Lemonade", 219], ["Blue Curacao", 219]], "Thick Shakes": [["Dryfruits Royale", 219], ["Golden Dates Delight", 209], ["Kaju Anjeer", 209], ["Gulkand", 209]], "Freak Shakes": [["Chocolate Brownie", 399], ["Cookies & Cream", 399]], "Cold Beverage": [["Red Bull", 125], ["Cold Coco", 60], ["Malai Lassi", 60]], "Ice Creams": [["Vanilla", 69], ["Pista", 69], ["Mango", 89], ["Fresh Strawberry", 89], ["Butterscotch", 89], ["Choco Chips", 89], ["Dark Choco Fantasy", 109], ["Tiramisu", 109]], "Shakes": [["Vanilla Shake", 129], ["Pista Shake", 129], ["Mango Shake", 159], ["Fresh Strawberry Shake", 159], ["Butterscotch Shake", 159], ["Blueberry Shake", 159], ["Kitkat Shake", 159], ["Choco Chips Shake", 179], ["Oreo Cookie Shake", 179], ["Dark Choco Fantasy Shake", 179], ["Tiramisu Shake", 179], ["Biscoff Shake", 199]], "Waffles": [["Chocolate Fantasy Waffle", 179], ["Crunchy Kit-Kat Waffle", null], ["Crackling Nutella Waffle", null], ["Cream Cheese Oreo Waffle Cream", null], ["Cheese Red Velvet Waffle", null], ["Brownie Overload Waffle", null], ["Double Chocolate Waffle", null]], "Brownie": [["Classic Brownie", 199], ["Sizzling Brownie w/ Ice-Cream", 249]], "French Fries": [["Salted Fries", 119], ["Peri Peri Fries", 149], ["Bombay Achari Fries", 149], ["Cheesey Fries", 179], ["Loaded Peri Peri Fries", 179], ["Loaded Tandoori Fries", 179], ["Loaded Barbeque Cheese Fries", 179]], "Munching Bites": [["Cheese Balls", 189], ["Corn Cheese Balls", 189]], "Classic Pizza": [["Margherita Pizza", 189], ["Crunchy Veggies", 199], ["Jain Pizza", 199], ["Veg Delight", 199], ["Veg Cheese Pizza", 199]], "Premium Pizza": [["Golden Veg Corn Pizza", 249], ["Panner El Panso", 259]], "Signature Pizza": [["Jamaican Pizza", 299], ["Achari Marinate Pizza", 299], ["Kadhai Pizza", 299], ["Tandoori Tikka Pizza", 299], ["Smokey Barbeque Pizza", 299], ["Combination Pizza", 329]], "Burgers": [["Plain Veggie Mini Patty Burger", 99], ["Veggie Cheese Burger", 149], ["Kadhai Paneer Burger", 189], ["Jamaican Burger", 189], ["Tandoori Burger", 189], ["Heat & Sweet Burger", 189], ["Creamy Crunch Burger", 189], ["Tower Burger (any burger)", 289]], "Sandwich": [["Veg Grill", 119], ["Plain Cheese Grill", 119], ["Veggies Cheese Grill", 179], ["Veg Onion Capsicum Grill", 179], ["Veg Corn Cheese Grill", 179], ["Chocolate Toast", 179], ["Club Grill", 219], ["Grilled Thrill Club", 219], ["Mushroom Mashup Grill", 219], ["Mexigo Grill", 219], ["Kadhai Paneer Bhurji Grill", 219]], "Garlic Bread": [["Plain Garlic Bread", 109], ["Cheese Garlic Bread", 139], ["Cheese Chilli Garlic Onion Toast", 159]], "Maggie": [["Plain Maggie", 99], ["Veg Maggie", 119], ["Peri Peri Maggie", 129], ["Veg Cheese Maggie", 139], ["Cheese Jalapeno Maggie", 159], ["Tandoori Cheese Maggie", 159]], "Hot Beverage": [["Hot Coffee (250ml)", 129], ["Signature Hot Chocolate (250ml)", 169]], "Pasta": [["Red Pasta", 299], ["White Cheese Pasta", 299], ["Royal Fredo Pasta", 299], ["CheeseDunk Pasta", 299], ["Mac N Cheese Pasta", 349]], "Extras": [["Water Bottle", 10], ["Cheese Slice", 20], ["Cheese Topping", 30], ["Choco Crush", 20]], "Momos": [["Veg Momo — Steam", 139], ["Veg Momo — Fried", 149], ["Veg Momo — Toss", 199], ["Veg Mozzarella Momo — Steam", 169], ["Veg Mozzarella Momo — Fried", 179], ["Veg Mozzarella Momo — Toss", 229], ["Veg Peri Peri Momo — Steam", 159], ["Veg Peri Peri Momo — Fried", 169], ["Veg Peri Peri Momo — Toss", 229], ["Veg Cheese Corn Momo — Steam", 169], ["Veg Cheese Corn Momo — Fried", 179], ["Veg Cheese Corn Momo — Toss", 229], ["Paneer Peri Peri Momo — Steam", 169], ["Paneer Peri Peri Momo — Fried", 179], ["Paneer Peri Peri Momo — Toss", 229], ["Veg Cheese Kurkure — Fried", 229], ["Momo Platter (12 Pcs) — Steam", 259], ["Momo Platter (12 Pcs) — Fried", 279], ["Momo Platter (12 Pcs) — Toss", 319]]};
let cart={}; const wa="919512833139"; const parcelPerItem=10;
const money=n=>"₹"+n.toLocaleString("en-IN");
function render(filter=""){const root=document.getElementById("menu");root.innerHTML="";
Object.entries(MENU).forEach(([cat,items])=>{const m=items.filter(x=>x[0].toLowerCase().includes(filter.toLowerCase()));if(!m.length)return;
const sec=document.createElement("section");sec.id="cat-"+cat.replace(/\W/g,"");sec.innerHTML="<h2>"+cat+"</h2><div class='grid'></div>";
const grid=sec.querySelector(".grid");m.forEach(([name,price])=>{const d=document.createElement("div");d.className="item"+(price==null?" unpriced":"");
d.innerHTML='<div><div class="name">'+name+'</div>'+(price==null?"<div class='muted'>Price not printed in supplied menu</div>":"")+'</div>'+
'<div style="display:flex;align-items:center;gap:8px"><span class="price">'+(price==null?"Confirm":money(price))+'</span><button class="add">Add</button></div>';
d.querySelector("button").onclick=()=>addItem(name,price);grid.appendChild(d)});root.appendChild(sec)})}
function renderTabs(){const t=document.getElementById("tabs");t.innerHTML='<button class="tab" onclick="scrollTo({top:0,behavior:\'smooth\'})">All</button>';
Object.keys(MENU).forEach(c=>{const b=document.createElement("button");b.className="tab";b.textContent=c;b.onclick=()=>document.getElementById("cat-"+c.replace(/\W/g,""))?.scrollIntoView({behavior:"smooth"});t.appendChild(b)})}
function addItem(name,price){if(price==null){alert("This item has no price printed in the supplied menu. Please confirm its price with the café before ordering.");return}
if(!cart[name])cart[name]={price,qty:0};cart[name].qty++;update()}
function change(name,d){cart[name].qty+=d;if(cart[name].qty<=0)delete cart[name];update()}
function update(){let count=0,sub=0;Object.values(cart).forEach(x=>{count+=x.qty;sub+=x.qty*x.price});
document.getElementById("count").textContent=count+" item"+(count===1?"":"s");document.getElementById("total").textContent=money(sub+count*parcelPerItem)}
function openCart(){document.getElementById("drawer").style.display="flex";renderCart()}function closeCart(){document.getElementById("drawer").style.display="none"}
function renderCart(){const c=document.getElementById("cart");c.innerHTML="";let sub=0,count=0;Object.entries(cart).forEach(([n,x])=>{
sub+=x.qty*x.price;count+=x.qty;const r=document.createElement("div");r.className="row";
r.innerHTML="<div><b>"+n+"</b><div class='muted'>"+money(x.price)+" each</div></div><div class='qty'><button>−</button> <b>"+x.qty+"</b> <button>+</button></div>";
r.querySelectorAll("button")[0].onclick=()=>{change(n,-1);renderCart()};r.querySelectorAll("button")[1].onclick=()=>{change(n,1);renderCart()};c.appendChild(r)});
if(!count)c.innerHTML="<p>Your cart is empty.</p>";else c.innerHTML+="<hr><div class='row'><span>Items subtotal</span><b>"+money(sub)+"</b></div><div class='row'><span>Parcel charges ("+count+" × ₹10)</span><b>"+money(count*parcelPerItem)+"</b></div><div class='row'><strong>Total</strong><strong>"+money(sub+count*parcelPerItem)+"</strong></div>"}
function sendWhatsApp(){const entries=Object.entries(cart);if(!entries.length){alert("Please add at least one item.");return}
const name=document.getElementById("custName").value.trim(),phone=document.getElementById("custPhone").value.trim();if(!name||!phone){alert("Please enter your name and mobile number.");return}
let sub=0,count=0,lines=[];entries.forEach(([n,x])=>{sub+=x.qty*x.price;count+=x.qty;lines.push(x.qty+" × "+n+" — ₹"+(x.qty*x.price))});
let msg="*NEW PICKUP ORDER — BEYOND TEMPTATION CAFÉ*\n\nName: "+name+"\nCustomer Mobile: "+phone+"\n\n*Items:*\n"+lines.join("\n")+"\n\nItems Subtotal: ₹"+sub+"\nParcel Charges: ₹"+(count*parcelPerItem)+"\n*TOTAL: ₹"+(sub+count*parcelPerItem)+"*\n\nOrder Type: *PICKUP*";
const notes=document.getElementById("notes").value.trim();if(notes)msg+="\nNotes: "+notes;msg+="\n\nPlease confirm my pickup order.";
window.open("https://wa.me/"+wa+"?text="+encodeURIComponent(msg),"_blank")}
document.getElementById("search").addEventListener("input",e=>render(e.target.value));renderTabs();render();
</script></body></html>
